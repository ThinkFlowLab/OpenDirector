# Local lightweight checks only. Install: python -m pre_commit install
# Before PR: python -m pre_commit run --from-ref upstream/main --to-ref HEAD
minimum_pre_commit_version: '4.5.1'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Parse custom YAML tags without constructing Python objects.
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-ast
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
        # Keep this hook portable: shellcheck/pyflakes are separate toolchains.
        args: [-shellcheck=, -pyflakes=]
