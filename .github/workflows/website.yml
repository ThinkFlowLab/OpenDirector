name: Website

on:
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/build-website.sh'
      - 'tests/browser/engine.mjs'
      - 'docs/guides/assets/dota2-short-film-canvas.jpg'
      - 'docs/guides/assets/dota2-short-film.mp4'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-website.sh'
      - 'tests/browser/engine.mjs'
      - 'docs/guides/assets/dota2-short-film-canvas.jpg'
      - 'docs/guides/assets/dota2-short-film.mp4'
      - '.github/workflows/website.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-downloads:
    if: github.event_name == 'release' && github.repository == 'ThinkFlowLab/OpenDirector' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the Pages build on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/website.yml/dispatches" -f ref=main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - run: node --test website/installers.test.mjs
      - name: Build the website with published downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/build-website.sh "$RUNNER_TEMP/pages/OpenDirector"
      - name: Check the built site in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --no-package-lock playwright-core@1.58.2
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright-core/index.mjs"
          node "$RUNNER_TEMP/browser/node_modules/playwright-core/cli.js" install --with-deps --only-shell chromium
          python3 -m http.server 8780 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pages" &
          server=$!
          trap 'kill "$server"' EXIT
          curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:8780/OpenDirector/ -o /dev/null
          node website/site.test.mjs
      - if: github.repository == 'ThinkFlowLab/OpenDirector' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages/OpenDirector

  deploy:
    if: github.repository == 'ThinkFlowLab/OpenDirector' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
