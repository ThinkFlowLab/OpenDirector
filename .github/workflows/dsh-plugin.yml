name: DSH plugin checks

on:
  pull_request:
    paths:
      - 'plugins/deepseek-harness/**'
      - '.github/workflows/dsh-plugin.yml'
      - '.nvmrc'
  push:
    branches: [main]
    paths:
      - 'plugins/deepseek-harness/**'
      - '.github/workflows/dsh-plugin.yml'
      - '.nvmrc'

permissions:
  contents: read

jobs:
  tests:
    name: Plugin checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: plugins/deepseek-harness/package-lock.json
      - name: Install DSH plugin dependencies
        working-directory: plugins/deepseek-harness
        run: npm ci
      - name: DSH plugin tests
        working-directory: plugins/deepseek-harness
        run: npm test
      - name: Check the installable DSH bundle
        shell: bash
        working-directory: plugins/deepseek-harness
        run: |
          npm pack --json > package-check.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, unlinkSync } from 'node:fs'

          const run = (command, args) => execFileSync(command, args, { encoding: 'utf8' })
          const [{ filename }] = JSON.parse(readFileSync('package-check.json', 'utf8'))
          try {
            const entries = new Set(run('tar', ['-tzf', filename]).trim().split(/\r?\n/))
            const manifest = JSON.parse(run('tar', ['-xOzf', filename, 'package/package.json']))
            for (const entry of [manifest.dsh?.bundle?.patch, manifest.exports?.['./client']]) {
              assert.ok(entry?.startsWith('./') && entries.has('package/' + entry.slice(2)), entry)
            }
            assert.ok(manifest.version && manifest.engines?.dsh)
          } finally {
            unlinkSync(filename)
            unlinkSync('package-check.json')
          }
          NODE
