# Reusable "Release checks" job, shared by ci.yml (PR / push to main) and
# nightly.yml (scheduled nightly gate-parity lane).
#
# Check steps after "Install locked dependencies" run independently of each
# other so one failing lane does not hide the outcome of the remaining lanes;
# they are still skipped when the environment install itself fails.
name: Release checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CREATION_WEB_URL: http://127.0.0.1:5179
      CREATION_API_URL: http://127.0.0.1:8019
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders 2>&1 | grep 'libx264 '
      - id: install
        name: Install locked dependencies
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          python --version
          python -m pip install -v -r requirements.txt
          npm exec --no -- opencode --version
          python -m pip check
      - name: Frontend tests
        if: always() && steps.install.outcome == 'success'
        run: npm test
      - name: Check bilingual catalogs
        if: always() && steps.install.outcome == 'success'
        run: npm run check:i18n
      - name: Check browser locale pins
        if: always() && steps.install.outcome == 'success'
        run: npm run check:browser-locale
      - name: Check browser manifest
        if: always() && steps.install.outcome == 'success'
        run: npm run check:browser-manifest
      - name: Check layer imports
        if: always() && steps.install.outcome == 'success'
        run: lint-imports
      # Runs before the Python suite: a failing or hanging test run must not hide
      # whether the checked-in contracts still match the models.
      - name: Check generated contracts
        if: always() && steps.install.outcome == 'success'
        run: python scripts/generate_contracts.py --check
      - name: Python tests
        if: always() && steps.install.outcome == 'success'
        run: python -m pytest tests -q -ra
      - name: Bundled OpenCode model gateway regression
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 5
        env:
          OPENDIRECTOR_REAL_CLI: '1'
        run: python -m pytest tests/test_native_runtime.py -k real_opencode -q -ra
      - name: Production build
        if: always() && steps.install.outcome == 'success'
        run: npm run build
      - name: Verify installed wheel without Node.js
        if: always() && steps.install.outcome == 'success'
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/opendirector-wheels"
          python -m venv "$RUNNER_TEMP/opendirector-wheel-venv"
          "$RUNNER_TEMP/opendirector-wheel-venv/bin/python" -m pip install "$RUNNER_TEMP"/opendirector-wheels/opendirector-*.whl
          "$RUNNER_TEMP/opendirector-wheel-venv/bin/python" -m pip check
          python scripts/verify_install.py --python "$RUNNER_TEMP/opendirector-wheel-venv/bin/python"
      - name: Install isolated browser dependencies
        if: always() && steps.install.outcome == 'success'
        run: |
          npm install --prefix "$RUNNER_TEMP/opendirector-browser" --no-save --no-package-lock playwright-core@1.58.2
          node "$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/cli.js" install --with-deps --only-shell chromium
      - name: Isolated browser workflows
        if: always() && steps.install.outcome == 'success'
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/index.mjs"
          python tests/browser/creation_server.py --port 8019 >"$RUNNER_TEMP/creation-server.log" 2>&1 &
          api_pid=$!
          OPENDIRECTOR_API_URL="$CREATION_API_URL" npm run dev -- --port 5179 --strictPort >"$RUNNER_TEMP/vite.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health" >/dev/null && curl --silent --fail "$CREATION_WEB_URL/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health"
          curl --silent --fail "$CREATION_WEB_URL/" >/dev/null
          node scripts/run-browser-suite.mjs
      - name: Voice library workflows
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 5
        env:
          CREATION_WEB_URL: http://127.0.0.1:5190
          CREATION_API_URL: http://127.0.0.1:8030
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/index.mjs"
          python tests/browser/voice_library_server.py --port 8030 >"$RUNNER_TEMP/voice-server.log" 2>&1 &
          api_pid=$!
          OPENDIRECTOR_API_URL="$CREATION_API_URL" node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5190 --strictPort >"$RUNNER_TEMP/voice-vite.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true; wait "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/voice-test-health" >/dev/null && curl --silent --fail "$CREATION_WEB_URL/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/voice-test-health"
          curl --silent --fail "$CREATION_WEB_URL/" >/dev/null
          node tests/browser/voice_library.mjs
      - name: Assistant auxiliary panels
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 5
        env:
          CREATION_WEB_URL: http://127.0.0.1:5180
          CREATION_API_URL: http://127.0.0.1:8020
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/index.mjs"
          python tests/browser/creation_server.py --port 8020 --assistant-fixture >"$RUNNER_TEMP/assistant-creation-server.log" 2>&1 &
          api_pid=$!
          OPENDIRECTOR_API_URL="$CREATION_API_URL" node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5180 --strictPort >"$RUNNER_TEMP/assistant-vite.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true; wait "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health" >/dev/null && curl --silent --fail "$CREATION_WEB_URL/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health"
          curl --silent --fail "$CREATION_WEB_URL/" >/dev/null
          node tests/browser/assistant_auxiliary_panels.mjs
      - name: Print isolated service logs on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/voice-server.log" "$RUNNER_TEMP/voice-vite.log" "$RUNNER_TEMP/creation-server.log" "$RUNNER_TEMP/vite.log" "$RUNNER_TEMP/assistant-creation-server.log" "$RUNNER_TEMP/assistant-vite.log"; do
            if [ -f "$log" ]; then tail -n 150 "$log"; fi
          done
