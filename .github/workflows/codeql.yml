name: CodeQL

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL / 初始化安全扫描
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze and record results / 扫描并记录结果
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          # Code scanning does not report its PR alert check on merge groups.
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}
          wait-for-processing: true
      - name: Save queue scan evidence / 保存队列扫描证据
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-merge-group-${{ matrix.language }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          retention-days: 14
          if-no-files-found: error

  # Stable required-check candidate, independent of docs-only release skips.
  checks:
    name: CodeQL / checks
    if: always()
    needs: analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require all analyses / 要求全部语言扫描成功
        env:
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: >-
          python -c 'import os, sys; result = os.environ.get("ANALYSIS_RESULT", "missing");
          print("CodeQL analysis / 安全扫描: " + result); sys.exit(0 if result == "success" else 1)'
