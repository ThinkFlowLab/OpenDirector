# Nightly checks on main HEAD. Complements the PR-gate "Release checks":
# gate-parity re-runs the same bar verbatim, the extended lanes cover what a
# 30-minute PR budget cannot (full browser suite, the production build served
# for real journeys, output verification, flake observation).
#
# Release policy: cutting a daily v0.1.x requires the gate-parity lane green
# on the candidate SHA. The extended lanes are advisory in v1: their failures
# are reported and tracked, but they do not block a release by themselves.
# Matrix and policy are documented in docs/development/validation.md.
#
# Schedule: 0 18 * * * UTC = 02:00 Asia/Shanghai next day.
name: Nightly checks

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CREATION_WEB_URL: http://127.0.0.1:5179
  CREATION_API_URL: http://127.0.0.1:8019

jobs:
  # Lane 1: the same bar as the PR gate, run against main HEAD. This is the
  # release-decision lane: it catches flaky merges landing on main and
  # environment drift that only shows when the environment, not a PR, changes.
  gate-parity:
    if: github.event_name != 'schedule' || github.repository == 'ThinkFlowLab/OpenDirector'
    uses: ./.github/workflows/release-checks.yml

  # Lane 2: classify Python-suite failures as flaky or real (one rerun of the
  # failed subset) and quantify the known-flaky watchlist (3 runs).
  pytest-flake-triage:
    if: github.event_name != 'schedule' || github.repository == 'ThinkFlowLab/OpenDirector'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - id: suite
        continue-on-error: true
        name: Full Python suite
        run: python -m pytest tests -q -ra
      - name: Collect failed test ids
        if: steps.suite.outcome == 'failure'
        run: python -m pytest --lf --collect-only -q 2>/dev/null | grep '::' > failed-tests.txt || true
      - id: rerun
        if: steps.suite.outcome == 'failure'
        continue-on-error: true
        name: Rerun failed subset once
        run: python -m pytest --lf -q -ra
      - id: classify
        if: always()
        name: Classify outcome and probe flaky watchlist
        run: |
          set -u
          IDS=()
          while IFS= read -r line; do IDS+=("$line"); done < <(grep -v '^\s*#' scripts/nightly/flaky-watchlist.txt | grep -v '^\s*$' || true)
          watchlist="absent"
          if [ "${#IDS[@]}" -gt 0 ]; then
            watchlist=""
            for run in 1 2 3; do
              if python -m pytest "${IDS[@]}" -q -ra >"/tmp/watchlist-run$run.log" 2>&1; then
                watchlist="$watchlist run$run=pass"
              else
                watchlist="$watchlist run$run=fail"
              fi
            done
          fi
          if [ "${{ steps.suite.outcome }}" = "success" ]; then
            classification=pass
            failed="[]"
            rerun="not-needed"
          elif [ "${{ steps.suite.outcome }}" != "failure" ]; then
            classification=skipped
            failed="[]"
            rerun="not-needed"
          elif [ "${{ steps.rerun.outcome }}" = "success" ]; then
            classification=flaky
            rerun=pass
          else
            classification=fail
            rerun="${{ steps.rerun.outcome }}"
          fi
          if [ -f failed-tests.txt ]; then
            failed="$(jq -Rsc 'split("\n") | map(select(length > 0))' failed-tests.txt)"
          fi
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg classification "$classification" --arg rerun "$rerun" \
            --arg watchlist "$watchlist" --argjson failed "$failed" \
            '{sha: $sha, runId: ($run | tonumber), classification: $classification,
              rerun: $rerun, watchlist: $watchlist, failedTests: $failed}' > flake-report.json
          {
            echo "## Python flake triage"
            echo ""
            echo "- Classification: **$classification**"
            echo "- Rerun of failed subset: $rerun"
            echo "- Watchlist (3 runs): $watchlist"
            if [ "$failed" != "[]" ]; then
              echo "- Failed tests:"
              echo ''
              echo '```'
              jq -r '.failedTests[]' flake-report.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-report
          path: flake-report.json

  # Lane 3: every browser workflow that the PR gate does not run, against the
  # dev server. Failures here are tracked, not release-blocking.
  browser-extended:
    if: github.event_name != 'schedule' || github.repository == 'ThinkFlowLab/OpenDirector'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/opendirector-browser" --no-save --no-package-lock playwright-core@1.58.2
          node "$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/cli.js" install --with-deps --only-shell chromium
      - name: Extended browser workflows
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/index.mjs"
          mkdir -p "$RUNNER_TEMP/extended-logs"
          fixture_api_pid=""
          fixture_web_pid=""
          python tests/browser/creation_server.py --port 8019 >"$RUNNER_TEMP/creation-server.log" 2>&1 &
          api_pid=$!
          OPENDIRECTOR_API_URL="$CREATION_API_URL" npm run dev -- --port 5179 --strictPort >"$RUNNER_TEMP/vite.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" "$fixture_api_pid" "$fixture_web_pid" 2>/dev/null || true; wait 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health" >/dev/null && curl --silent --fail "$CREATION_WEB_URL/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health"
          curl --silent --fail "$CREATION_WEB_URL/" >/dev/null
          # Lane membership comes from tests/browser/manifest.json; the
          # Release checks gate step verifies the manifest matches reality.
          scripts=()
          while IFS= read -r line; do scripts+=("$line"); done < <(
            node -e 'const m=require("./tests/browser/manifest.json");for(const s of m.scripts)if((s.lanes||[]).includes("extended"))console.log([s.file,...(s.args||[])].join(" "))'
          )
          failed=0
          : > extended-results.txt
          for entry in "${scripts[@]}"; do
            log="$RUNNER_TEMP/extended-logs/${entry%.mjs}.log"
            if node "tests/browser/$entry" >"$log" 2>&1; then
              echo "pass $entry" >> extended-results.txt
            else
              echo "fail $entry" >> extended-results.txt
              failed=1
            fi
          done
          # Assistant-fixture scripts need their own isolated services, mirroring
          # the Release checks "Assistant auxiliary panels" phase.
          python tests/browser/creation_server.py --port 8020 --assistant-fixture >"$RUNNER_TEMP/assistant-creation-server.log" 2>&1 &
          fixture_api_pid=$!
          OPENDIRECTOR_API_URL=http://127.0.0.1:8020 npm run dev -- --port 5180 --strictPort >"$RUNNER_TEMP/assistant-vite.log" 2>&1 &
          fixture_web_pid=$!
          for attempt in {1..60}; do
            if curl --silent --fail -H 'X-OpenDirector-Request: 1' http://127.0.0.1:8020/api/creation-test-health >/dev/null && curl --silent --fail http://127.0.0.1:5180/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail -H 'X-OpenDirector-Request: 1' http://127.0.0.1:8020/api/creation-test-health
          curl --silent --fail http://127.0.0.1:5180/ >/dev/null
          fixture_scripts=()
          while IFS= read -r line; do fixture_scripts+=("$line"); done < <(
            node -e 'const m=require("./tests/browser/manifest.json");for(const s of m.scripts)if((s.lanes||[]).includes("extendedFixture"))console.log([s.file,...(s.args||[])].join(" "))'
          )
          for entry in "${fixture_scripts[@]}"; do
            log="$RUNNER_TEMP/extended-logs/${entry%.mjs}.log"
            if node "tests/browser/$entry" >"$log" 2>&1; then
              echo "pass $entry" >> extended-results.txt
            else
              echo "fail $entry" >> extended-results.txt
              failed=1
            fi
          done
          cat extended-results.txt
          if [ "$failed" -ne 0 ]; then
            for entry in "${scripts[@]}" "${fixture_scripts[@]}"; do
              log="$RUNNER_TEMP/extended-logs/${entry%.mjs}.log"
              if grep -Fq "fail $entry" extended-results.txt; then
                echo "===== $entry ====="
                tail -n 40 "$log"
              fi
            done
            exit 1
          fi
      - name: Print isolated service logs on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/creation-server.log" "$RUNNER_TEMP/vite.log" "$RUNNER_TEMP/assistant-creation-server.log" "$RUNNER_TEMP/assistant-vite.log"; do
            if [ -f "$log" ]; then tail -n 150 "$log"; fi
          done
      - name: Upload extended lane results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extended-browser-results
          path: |
            extended-results.txt
          if-no-files-found: ignore

  # Lane 4: core journeys served from the production build (vite preview of
  # dist) instead of the dev server, so the artifact a release would ship is
  # exercised, not only type-checked. Preview-safe scripts only: browser
  # scripts that import "/src/*.ts" in-page require the dev server.
  browser-production:
    if: github.event_name != 'schedule' || github.repository == 'ThinkFlowLab/OpenDirector'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/opendirector-browser" --no-save --no-package-lock playwright-core@1.58.2
          node "$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/cli.js" install --with-deps --only-shell chromium
      - name: Production-build browser journeys
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/index.mjs"
          mkdir -p "$RUNNER_TEMP/production-logs"
          python tests/browser/creation_server.py --port 8019 --assistant-fixture >"$RUNNER_TEMP/creation-server.log" 2>&1 &
          api_pid=$!
          OPENDIRECTOR_API_URL="$CREATION_API_URL" npm run preview -- --port 5179 --strictPort >"$RUNNER_TEMP/preview.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health" >/dev/null && curl --silent --fail "$CREATION_WEB_URL/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health"
          curl --silent --fail "$CREATION_WEB_URL/" >/dev/null
          scripts=()
          while IFS= read -r line; do scripts+=("$line"); done < <(
            node -e 'const m=require("./tests/browser/manifest.json");for(const s of m.scripts)if((s.lanes||[]).includes("production"))console.log([s.file,...(s.args||[])].join(" "))'
          )
          failed=0
          : > production-results.txt
          for entry in "${scripts[@]}"; do
            log="$RUNNER_TEMP/production-logs/$(echo "$entry" | tr ' .' '_').log"
            if node tests/browser/$entry >"$log" 2>&1; then
              echo "pass $entry" >> production-results.txt
            else
              echo "fail $entry" >> production-results.txt
              failed=1
            fi
          done
          cat production-results.txt
          if [ "$failed" -ne 0 ]; then
            for entry in "${scripts[@]}"; do
              log="$RUNNER_TEMP/production-logs/$(echo "$entry" | tr ' .' '_').log"
              if grep -Fq "fail $entry" production-results.txt; then
                echo "===== $entry ====="
                tail -n 40 "$log"
              fi
            done
            exit 1
          fi
      - name: Print isolated service logs on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/creation-server.log" "$RUNNER_TEMP/preview.log"; do
            if [ -f "$log" ]; then tail -n 150 "$log"; fi
          done
      - name: Upload production lane results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-browser-results
          path: production-results.txt
          if-no-files-found: ignore

  # Lane 5: output verification and performance sampling. The render probe is
  # a hard check: the exported MP4 is probed with ffprobe on disk. The drag
  # profile is diagnostic sampling (no machine-relative thresholds); numbers
  # are published per run so regressions become comparable over time.
  perf-outputs:
    if: github.event_name != 'schedule' || github.repository == 'ThinkFlowLab/OpenDirector'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/opendirector-browser" --no-save --no-package-lock playwright-core@1.58.2
          node "$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/cli.js" install --with-deps --only-shell chromium
      - name: Render probe and drag performance
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/opendirector-browser/node_modules/playwright-core/index.mjs"
          python tests/browser/creation_server.py --port 8019 >"$RUNNER_TEMP/creation-server.log" 2>&1 &
          api_pid=$!
          OPENDIRECTOR_API_URL="$CREATION_API_URL" npm run dev -- --port 5179 --strictPort >"$RUNNER_TEMP/vite.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health" >/dev/null && curl --silent --fail "$CREATION_WEB_URL/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail -H 'X-OpenDirector-Request: 1' "$CREATION_API_URL/api/creation-test-health"
          curl --silent --fail "$CREATION_WEB_URL/" >/dev/null
          node tests/browser/mp4_render_probe.mjs > /tmp/render-probe.json
          PROFILE_LABEL="nightly-${GITHUB_SHA::7}" node tests/browser/reference_drag_performance.mjs > /tmp/drag-perf.json
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --argjson render "$(cat /tmp/render-probe.json)" \
            --argjson drag "$(cat /tmp/drag-perf.json)" \
            '{sha: $sha, runId: ($run | tonumber), render: $render, drag: $drag}' > nightly-perf.json
          {
            echo "## Render output verification"
            echo ""
            echo '```json'
            cat /tmp/render-probe.json
            echo '```'
            echo ""
            echo "## Drag interaction profile (diagnostic, no thresholds)"
            echo ""
            echo '```json'
            jq '{fixture: .fixture, scenarios: [.scenarios[] | del(.top)]}' /tmp/drag-perf.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Print isolated service logs on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/creation-server.log" "$RUNNER_TEMP/vite.log"; do
            if [ -f "$log" ]; then tail -n 150 "$log"; fi
          done
      - name: Upload perf and output report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-perf
          path: |
            nightly-perf.json
            /tmp/opendirector-drag-nightly-*.cpuprofile
          if-no-files-found: ignore

  # Aggregated run summary; also the machine-readable lane record the
  # Coordinator consumes for the daily release decision.
  summary:
    if: always() && (github.event_name != 'schedule' || github.repository == 'ThinkFlowLab/OpenDirector')
    needs: [gate-parity, pytest-flake-triage, browser-extended, browser-production, perf-outputs]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Aggregate lane results
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          sha="${{ github.sha }}"
          flake="${{ needs.pytest-flake-triage.outputs.classification }}"
          [ -n "$flake" ] || flake=unknown
          cat > summary.md <<EOF
          ## Nightly checks — \`$sha\`

          | Lane | Result |
          | --- | --- |
          | Gate parity (Release checks) | ${{ needs.gate-parity.result }} |
          | Python flake triage | ${{ needs.pytest-flake-triage.result }} ($flake) |
          | Browser extended suite | ${{ needs.browser-extended.result }} |
          | Browser production build | ${{ needs.browser-production.result }} |
          | Perf & output verification | ${{ needs.perf-outputs.result }} |

          Release rule: cut the daily \`v0.1.x\` only when **gate parity** is
          \`success\` on this SHA. Extended lanes are advisory in v1.
          Run: $run_url
          EOF
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg sha "$sha" --arg run "$GITHUB_RUN_ID" --arg url "$run_url" \
            --arg gate "${{ needs.gate-parity.result }}" \
            --arg flake "${{ needs.pytest-flake-triage.result }}" \
            --arg flakeClass "$flake" \
            --arg extended "${{ needs.browser-extended.result }}" \
            --arg production "${{ needs.browser-production.result }}" \
            --arg perf "${{ needs.perf-outputs.result }}" \
            '{sha: $sha, runId: ($run | tonumber), url: $url,
              lanes: {gateParity: $gate, flakeTriage: {result: $flake, classification: $flakeClass},
                      browserExtended: $extended, browserProduction: $production, perfOutputs: $perf}}' \
            > nightly-summary.json
      - name: Upload nightly summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-summary
          path: nightly-summary.json
