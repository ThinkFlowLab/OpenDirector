name: Reviewer routing
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, ready_for_review, labeled, unlabeled, reopened]
  push:
    branches: [main]
    paths: ['.github/reviewer-routing.json', '.github/workflows/reviewer-routing.yml', 'scripts/github/reviewer-routing.cjs']
  workflow_dispatch:
permissions: {}
concurrency:
  group: reviewer-routing-${{ github.event.pull_request.number || 'labels' }}
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Never check out or execute the fork's head in this privileged workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Classify PR labels / 自动分类标签
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          LABEL_API_KEY: ${{ secrets.wtc_github }}
        with:
          script: |
            const { run } = require('./scripts/github/auto-labels.cjs');
            await run({ github, context, core });
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { run } = require('./scripts/github/reviewer-routing.cjs');
            await run({ github, context, core });
