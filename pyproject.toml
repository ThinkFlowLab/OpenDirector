[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "opendirector"
version = "0.1.0"
description = "Local video creation workspace and agent CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7", "filelock>=3.16,<4", "httpx>=0.27,<1", "anyio>=4,<5",
  "pydantic>=2,<3", "typer>=0.27.3,<0.28", "Pillow>=12,<14",
  "fonttools==4.68.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
opendirector = "opendirector.cli:main"
