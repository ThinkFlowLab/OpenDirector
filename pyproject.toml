[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "opendirector"
version = "0.1.3"
description = "Local video creation workspace and agent CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7", "filelock>=3.16,<4", "httpx>=0.27,<1", "anyio>=4,<5",
  "pydantic>=2.12,<3", "typer>=0.27.3,<0.28", "Pillow>=12,<14",
  "fonttools==4.68.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "starlette>=1.8,<2", "python-multipart>=0.0.33,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "distlib>=0.4,<1", "import-linter>=2.1,<3"]

[project.scripts]
opendirector = "opendirector.cli:main"

[tool.pytest.ini_options]
markers = [
  "ready: fast deterministic checks for PR feedback",
  "merge: broader stubbed integration checks for the pre-merge gate",
  "nightly: timing-sensitive or opt-in external-service checks",
]

[tool.importlinter]
root_packages = ["opendirector"]

[[tool.importlinter.contracts]]
name = "Application does not depend on infrastructure"
type = "forbidden"
source_modules = ["opendirector.application"]
forbidden_modules = ["opendirector.infrastructure", "opendirector.wiring"]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on application"
type = "forbidden"
source_modules = ["opendirector.infrastructure"]
forbidden_modules = ["opendirector.application", "opendirector.wiring"]

[[tool.importlinter.contracts]]
name = "Ports stay inside the boundary"
type = "forbidden"
source_modules = ["opendirector.ports"]
forbidden_modules = [
  "opendirector.application",
  "opendirector.infrastructure",
  "opendirector.wiring",
]

[[tool.importlinter.contracts]]
name = "Domain stays inside the boundary"
type = "forbidden"
source_modules = ["opendirector.domain"]
forbidden_modules = [
  "opendirector.application",
  "opendirector.infrastructure",
  "opendirector.ports",
  "opendirector.wiring",
]
